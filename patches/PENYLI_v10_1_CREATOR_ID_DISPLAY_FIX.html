<!-- PENYLI v10.1 — CREATOR ID DISPLAY FIX
     Insert immediately before </body> in PENYLI_BEYOND_REALMS_v10_0_MVP_SERVER_ORIGIN_FIX (2).html.
     Functional-only patch. Does not alter payment verification or generate a fake identity. -->
<script id="v101-creator-id-display-fix">
(()=> {
  'use strict';
  const $ = id => document.getElementById(id);
  const modal = $('v55Creator');
  const idBox = $('v55Id');
  if (!modal || !idBox) return;

  const readCreatorId = () =>
    localStorage.getItem('penyli_creator_id') ||
    localStorage.getItem('penyli_v57_creator') ||
    localStorage.getItem('penyli_v56_creator') ||
    localStorage.getItem('penyli_creator') || '';
  const readCreationId = () =>
    localStorage.getItem('penyli_v56_creation') ||
    localStorage.getItem('penyli_v55_creation') || '';
  const readTraceId = () =>
    localStorage.getItem('penyli_v56_trace') ||
    localStorage.getItem('penyli_v55_trace') || '';

  let lastRendered = '';
  let rendering = false;
  function render() {
    if (rendering) return;
    const rows = [
      ['CREATOR ID', readCreatorId()],
      ['CREATION ID', readCreationId()],
      ['TRACE ID', readTraceId()]
    ];
    const next = rows.map(([label, value]) => label + ': ' + (value || '—')).join('\n');
    if (next === lastRendered && idBox.textContent === next) return;
    rendering = true;
    lastRendered = next;
    idBox.textContent = next;
    rendering = false;
  }

  // Legacy handlers replace #v55Id wholesale; restore the separate fields.
  // Guarding against identical content prevents a MutationObserver loop.
  const observer = new MutationObserver(() => {
    if (idBox.textContent !== lastRendered) render();
  });
  observer.observe(idBox, { childList: true, characterData: true, subtree: true });

  const refreshWhenOpen = new MutationObserver(() => {
    if (modal.classList.contains('open')) render();
  });
  refreshWhenOpen.observe(modal, { attributes: true, attributeFilter: ['class'] });

  window.addEventListener('pageshow', render);
  window.addEventListener('storage', event => {
    if (!event.key || /^penyli_(creator_id|v57_creator|v56_creator|creator|v56_creation|v55_creation|v56_trace|v55_trace)$/.test(event.key)) {
      render();
    }
  });
  document.addEventListener('click', event => {
    if (event.target.closest('#v55Create, #v55Next')) {
      setTimeout(render, 0);
      setTimeout(render, 250);
      setTimeout(render, 800);
    }
  });

  window.PENYLI_CREATOR_ID_DISPLAY_V101 = { refresh: render };
  render();
})();
</script>
